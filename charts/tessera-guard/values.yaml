# Tessera Guard — default chart values. The real wiring (upstream, matrix,
# Seal token, host) is overridden in k8s-home-lab.
#
# Guard is the DATA PLANE: a transparent reverse proxy in front of one MCP
# endpoint. It plays the gates, and for a call the matrix marks
# `require-signature` it HOLDS the bytes and registers a consent at Seal —
# the arguments never reach the proof authority, and the agent never gets to
# re-type them.
#
# Stateless by principle (state doctrine): held bytes live in memory for at
# most the consent TTL. Nothing durable here — no volume, and a restart costs
# at worst a re-signature.
controller:
  replicas: 1

image:
  repository: ghcr.io/antorfr/tessera-guard
  tag: "main" # placeholder — pinned to a SemVer tag in k8s-home-lab
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true # nothing is written: the matrix is mounted read-only
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

env:
  TZ: "Europe/Paris"
  OSTIA_ADDR: ":8090"
  # No safe default for the upstream, the matrix or the Seal endpoint:
  # a Guard that guesses is a Guard that lets something through.

service:
  main:
    ports:
      http:
        enabled: true
        primary: true
        port: 8090

ingress:
  main:
    enabled: false

# TCP probes, deliberately: Guard is a TRANSPARENT proxy — every path it
# receives is relayed upstream, so it owns no HTTP route of its own and an
# `/healthz` probe would be answered by the fronted MCP server (404). A live
# listening socket is what "the process is up" means here.
# (Noted as a product gap: Guard could serve a local, non-proxied health
# route — but that means carving a path out of the proxy, which is a design
# decision, not a chart fix.)
# ⚠️ The delays are GENEROUS, and that is not idle caution. A door talks to an
# upstream, to the proof authority and — attached — to Control; on a busy node
# the Kubernetes default `timeoutSeconds: 1` misses three probes in a row and
# the pod is killed. Measured on the house instance: 19 restarts in 11 days,
# all in windows where the node was CPU-saturated, while a pod with these
# values rode the same windows out. A door that restarts under load refuses
# calls it should have judged.
probes:
  liveness:
    enabled: true
    custom: true
    spec:
      tcpSocket:
        port: 8090
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      tcpSocket:
        port: 8090
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 10
