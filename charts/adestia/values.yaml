# Default values for adestia.
# Real deployment values (image tag, hostPaths, env, ingress, OIDC client) are
# overridden at the cluster level (k8s-home-lab valuesContent): one release per
# body — alfred, skippy, nestor — from this single chart.

controller:
  replicas: 1

image:
  repository: ghcr.io/antorfr/adestia
  tag: latest # placeholder; the real tag is pinned cluster-side
  pullPolicy: IfNotPresent

# Kubernetes injects `<SERVICE>_PORT=tcp://…` for every service of the
# namespace unless this is off. A shell has no use for sixty variables about
# its neighbours, and a URL-shaped value landing on a setting name is a
# painful failure to diagnose.
enableServiceLinks: false

env: {}

service:
  main:
    ports:
      http:
        enabled: true
        primary: true
        port: 8730

ingress:
  main:
    enabled: false # enabled cluster-side (LAN-only exposure)

# Persistent state. All disabled by default; enable cluster-side with
# hostPath values, so a redeploy picks the same data back up.
persistence:
  workspace:
    # The cockpit: instructions, skills, decisions — the shared brain.
    enabled: false
    type: hostPath
    mountPath: /workspace
  home:
    # Claude sessions (~/.claude) and the subscription token armed from the UI.
    enabled: false
    type: hostPath
    mountPath: /home/node
  data:
    # Conversations, attachment inbox, driver secrets (0600).
    enabled: false
    type: hostPath
    mountPath: /data

additionalContainers: {}
